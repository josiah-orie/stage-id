services:
  mysql:
    image: mysql:8.4
    container_name: talenthub_mysql_dev
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: talenthub_dev
      MYSQL_USER: talenthub
      MYSQL_PASSWORD: talenthub_dev_pass
    ports:
      - "3306:3306"
    volumes:
      - talenthub_mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "talenthub", "-ptalenthub_dev_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: talenthub_minio_dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - talenthub_minio_dev_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: talenthub_mailhog_dev
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  talenthub_mysql_dev_data:
  talenthub_minio_dev_data:
