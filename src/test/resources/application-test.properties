spring.datasource.url=jdbc:tc:mysql:8.4.0:///talenthub_test?TC_REUSABLE=true
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.athlete-media-bucket=athlete-media
minio.org-media-bucket=org-media
minio.private-docs-bucket=private-docs
jwt.secret=test-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256-algorithm
jwt.access-token.expiry-minutes=60
jwt.refresh-token.expiry-days=30
management.endpoints.web.exposure.include=health
media.max-video-size-bytes=524288000
payment.provider=paystack
