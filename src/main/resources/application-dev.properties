spring.datasource.url=jdbc:mysql://localhost:3306/talenthub_dev?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=talenthub
spring.datasource.password=talenthub_dev_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.athlete-media-bucket=athlete-media
minio.org-media-bucket=org-media
minio.private-docs-bucket=private-docs
jwt.secret=dev-secret-key-change-in-production-must-be-at-least-256-bits-long
jwt.access-token.expiry-minutes=60
jwt.refresh-token.expiry-days=30
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
logging.level.com.jovine360=DEBUG
media.max-video-size-bytes=524288000
payment.provider=paystack
