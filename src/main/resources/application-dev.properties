
#-- MySQL Datasource Config ---
spring.datasource.url=jdbc:mysql://localhost:3306/talenthub_dev?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Flyway Config ---
spring.flyway.enabled=true
# dev-seed holds V1000+ test data for every role (dev profile only)
spring.flyway.locations=classpath:db/migration,classpath:db/dev-seed
spring.flyway.baseline-on-migrate=true

# --- Gmail Mail Config ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:jovine360helpdesk@gmail.com}
spring.mail.password=${GMAIL_PASSWORD:flrkvxekizlthgnk}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.ssl.checkserveridentity=false
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.mime.charset=UTF-8
spring.mail.properties.mail.debug=true
logging.level.org.springframework.mail=DEBUG
buildstack.mail.from=${MAIL_FROM:jovine360helpdesk@gmail.com}

# --- Minio Configuration ---
