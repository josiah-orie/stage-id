spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

minio.endpoint=${MINIO_ENDPOINT}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.athlete-media-bucket=${MINIO_ATHLETE_BUCKET:athlete-media}
minio.org-media-bucket=${MINIO_ORG_BUCKET:org-media}
minio.private-docs-bucket=${MINIO_PRIVATE_BUCKET:private-docs}

jwt.secret=${JWT_SECRET}
jwt.access-token.expiry-minutes=${JWT_ACCESS_EXPIRY_MINUTES:60}
jwt.refresh-token.expiry-days=${JWT_REFRESH_EXPIRY_DAYS:30}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
logging.level.com.jovine360=INFO

media.max-video-size-bytes=${MAX_VIDEO_SIZE_BYTES:524288000}

payment.provider=${PAYMENT_PROVIDER:paystack}
payment.paystack.secret-key=${PAYSTACK_SECRET_KEY}
